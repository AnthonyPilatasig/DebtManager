version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: debt_manager_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: DevLocalSecret123!
      POSTGRES_DB: debt_manager_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
